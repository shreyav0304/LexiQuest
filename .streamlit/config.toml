[theme]
base = "light"
primaryColor = "#6955D8"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#F0F1F8"
textColor = "#242741"
borderColor = "#E3E5F0"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.5rem", "1.75rem", "1.2rem"]
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0EDFC"
textColor = "#34374F"
primaryColor = "#6955D8"

[browser]
gatherUsageStats = false
