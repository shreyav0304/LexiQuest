[theme]
base = "light"
primaryColor = "#6955D8"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#EEF0F6"
textColor = "#24283F"
borderColor = "#E2E5EF"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.5rem", "1.75rem", "1.2rem"]
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0EDFC"
textColor = "#34374F"
primaryColor = "#6955D8"

[browser]
gatherUsageStats = false
