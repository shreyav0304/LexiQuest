[theme]
base = "light"
primaryColor = "#087F72"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#EDF3F1"
textColor = "#1B343B"
borderColor = "#DCE6E2"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.5rem", "1.75rem", "1.2rem"]
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#132C35"
secondaryBackgroundColor = "#21434B"
textColor = "#E7F2EF"
primaryColor = "#70D4BB"

[browser]
gatherUsageStats = false
